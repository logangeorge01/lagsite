<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Files</title>
  <style>
    body {
      max-width: 750px;
      margin: 5% 10%;
      font-size: 1.4em;
      line-height: 1.4;
    }
    ul { padding-left: 1.2em; font-size: 0.8em; }
    li { margin-bottom: 8px; overflow-wrap: anywhere; }

    @media (max-width: 600px) {
      body { margin: 24px 20px; font-size: 1.15em; }
      li { margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <div>Files</div>
  <ul id="files"></ul>
  <script>
    (async () => {
      const list = document.getElementById('files');
      try {
        const res = await fetch('https://api.github.com/repos/logangeorge01/lagsite/contents/files/');
        const data = await res.json();
        for (const file of data) {
          if (file.name === 'index.html') continue;
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = encodeURIComponent(file.name);
          a.textContent = file.name;
          li.appendChild(a);
          list.appendChild(li);
        }
      } catch {
        list.innerHTML = '<li>Couldn\'t load files.</li>';
      }
    })();
  </script>
</body>
</html>
